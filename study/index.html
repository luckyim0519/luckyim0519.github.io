<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Im — Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&family=Source+Code+Pro:wght@400;500&family=Libre+Barcode+128+Text&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />

  <style>
    body { background: var(--off); }

    /* ── page grid: two equal columns ── */
    .study-tree {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 80px;
      margin-top: 8px;
    }

    .tree-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-self: center;
    }

    /* ── root label ── */
    .tree-root {
      font-family: 'Libre Barcode 128 Text', cursive;
      font-size: 2.2rem;
      color: var(--ink);
      display: block;
      text-align: center;
    }

    /* ── SVG branch lines ── */
    .branch-svg {
      width: 180px;
      height: 40px;
      display: block;
      color: var(--ink);
      flex-shrink: 0;
    }

    /* ── level-1 children row ── */
    .leaf-row {
      display: flex;
      justify-content: space-between;
      width: 180px;
      align-items: flex-start;
    }

    /* ── leaf node ── */
    .tree-leaf {
      font-family: 'Source Code Pro', monospace;
      font-size: 0.8rem;
      color: var(--ink);
      text-decoration: none;
      display: block;
      width: 64px;
      text-align: center;
    }
    .tree-leaf:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ── inner column: node + its single sub-child ── */
    .inner-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 64px;
    }
    .sub-svg {
      width: 64px;
      height: 36px;
      display: block;
      color: var(--ink);
      flex-shrink: 0;
    }
    .sub-left  { align-self: flex-start; }
    .sub-right { align-self: flex-end; }

    /* ── responsive ── */
    @media (max-width: 768px) {
      .study-tree { grid-template-columns: 1fr; gap: 84px; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav id="nav">
    <a class="nav-logo" href="/">LI</a>
    <ul class="nav-links">
      <li><a href="/about">About</a></li>
      <li><a href="/study" class="active">Study</a></li>
      <li><a href="/art">Art</a></li>
    </ul>
    <button class="nav-hamburger" id="nav-hamburger" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- STUDY TREE -->
  <section id="study-page">
    <div class="section-label reveal">Study</div>

    <div class="study-tree">

      <!-- #AI: Entry1(left, has child Entry3) + Entry2(right) -->
      <div class="tree-col reveal">
        <span class="tree-root">#AI</span>
        <svg class="branch-svg" viewBox="0 0 180 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="90" y1="0" x2="90" y2="10" stroke="currentColor" stroke-width="1"/>
          <line x1="90" y1="10" x2="32" y2="40" stroke="currentColor" stroke-width="1"/>
          <line x1="90" y1="10" x2="148" y2="40" stroke="currentColor" stroke-width="1"/>
        </svg>
        <div class="leaf-row">
          <div class="inner-col">
            <a class="tree-leaf" href="/study/entry1">Entry 1</a>
            <svg class="sub-svg" viewBox="0 0 64 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <line x1="32" y1="0" x2="32" y2="36" stroke="currentColor" stroke-width="1"/>
            </svg>
            <a class="tree-leaf sub-left" href="/study/entry3">Entry 3</a>
          </div>
          <a class="tree-leaf" href="/study/entry2">Entry 2</a>
        </div>
      </div>

      <!-- #SW: Entry1(left) + Entry2(right, has child Entry3) -->
      <div class="tree-col reveal">
        <span class="tree-root">#SW</span>
        <svg class="branch-svg" viewBox="0 0 180 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="90" y1="0" x2="90" y2="10" stroke="currentColor" stroke-width="1"/>
          <line x1="90" y1="10" x2="32" y2="40" stroke="currentColor" stroke-width="1"/>
          <line x1="90" y1="10" x2="148" y2="40" stroke="currentColor" stroke-width="1"/>
        </svg>
        <div class="leaf-row">
          <a class="tree-leaf" href="/study/sw/entry1">Entry 1</a>
          <div class="inner-col">
            <a class="tree-leaf" href="/study/sw/entry2">Entry 2</a>
            <svg class="sub-svg" viewBox="0 0 64 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <line x1="32" y1="0" x2="32" y2="36" stroke="currentColor" stroke-width="1"/>
            </svg>
            <a class="tree-leaf sub-right" href="/study/sw/entry3">Entry 3</a>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="footer-left">
      <span class="footer-name">Lucky Im</span>
      <span class="footer-sub">Creative engineer seeking the key to the world's bottleneck.</span>
    </div>
    <div class="footer-links">
      <a href="https://github.com/luckyim0519" target="_blank">GitHub</a>
      <a href="https://www.linkedin.com/in/luckyim/?originalSubdomain=ca" target="_blank">LinkedIn</a>
    </div>
    <span class="footer-copy">© 2025 · Vancouver, CA</span>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
