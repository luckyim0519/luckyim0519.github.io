<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Im — Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />

  <style>
    /* ── white page ── */
    body { background: var(--white); }

    /* ── tree layout ── */
    .study-tree {
      display: flex;
      gap: 80px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .tree-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 240px;
    }

    /* ── root node (circle) ── */
    .tree-root-node {
      width: 88px; height: 88px;
      border-radius: 50%;
      background: var(--ink);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Serif Display', serif;
      font-size: 1rem; letter-spacing: 0.06em;
      position: relative;
      animation: cell-breathe 3s ease-in-out infinite;
      z-index: 1;
    }
    .tree-root-node::before,
    .tree-root-node::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      border: 1px solid var(--ink);
      width: 100%; height: 100%;
      top: 0; left: 0;
      animation: cell-ripple 3s ease-out infinite;
      pointer-events: none;
    }
    .tree-root-node::after { animation-delay: 1.5s; }

    /* ── vertical connector root → leaves ── */
    .tree-connector {
      width: 1px;
      height: 40px;
      background: var(--ink);
      margin-left: 43px;
    }

    /* ── leaves container ── */
    .tree-leaves {
      position: relative;
      padding-left: 56px;
      border-left: 1px solid var(--ink);
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-top: 8px;
      padding-bottom: 8px;
    }

    /* ── individual leaf entry ── */
    .tree-leaf {
      position: relative;
      text-decoration: none;
      display: block;
    }
    .tree-leaf::before {
      content: '';
      position: absolute;
      left: -56px;
      top: 50%;
      width: 56px;
      height: 1px;
      background: var(--ink);
    }
    .tree-leaf-inner {
      border: 1px solid var(--border);
      padding: 14px 20px;
      background: var(--white);
      transition: background 0.2s, border-color 0.2s;
    }
    .tree-leaf:hover .tree-leaf-inner {
      background: var(--off);
      border-color: var(--ink);
    }
    .leaf-tag {
      font-size: 0.65rem; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 4px;
    }
    .leaf-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1rem; color: var(--ink);
      display: block;
    }
    .leaf-date {
      font-size: 0.72rem; color: var(--muted);
      margin-top: 4px; display: block;
    }

    /* ── placeholder (no entries yet) ── */
    .tree-placeholder {
      font-size: 0.78rem; color: var(--muted);
      font-style: italic;
      font-family: 'DM Serif Display', serif;
      padding-left: 12px;
    }

    /* ── animations ── */
    @keyframes cell-breathe {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.06); }
    }
    @keyframes cell-ripple {
      0%   { transform: scale(1);   opacity: 0.45; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /* ── responsive ── */
    @media (max-width: 768px) {
      .study-tree { flex-direction: column; gap: 56px; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav id="nav">
    <a class="nav-logo" href="/">LI</a>
    <ul class="nav-links">
      <li><a href="/about">About</a></li>
      <li><a href="/study" class="active">Study</a></li>
      <li><a href="/art">Art</a></li>
    </ul>
    <button class="nav-hamburger" id="nav-hamburger" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- STUDY TREE -->
  <section id="study-page">
    <div class="section-label reveal">Study</div>

    <div class="study-tree">

      <!-- AI subtree -->
      <div class="tree-col reveal">
        <div class="tree-root-node">AI</div>
        <div class="tree-connector"></div>
        <div class="tree-leaves">
          <a class="tree-leaf" href="/study/entry1">
            <div class="tree-leaf-inner">
              <div class="leaf-tag">AI</div>
              <span class="leaf-title">Entry 1</span>
              <span class="leaf-date">March 2026</span>
            </div>
          </a>
        </div>
      </div>

      <!-- SW subtree -->
      <div class="tree-col reveal">
        <div class="tree-root-node">SW</div>
        <div class="tree-connector"></div>
        <div class="tree-leaves">
          <span class="tree-placeholder">Coming soon —</span>
        </div>
      </div>

    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="footer-left">
      <span class="footer-name">Lucky Im</span>
      <span class="footer-sub">Creative engineer seeking the key to the world's bottleneck.</span>
    </div>
    <div class="footer-links">
      <a href="https://github.com/luckyim0519" target="_blank">GitHub</a>
      <a href="https://www.linkedin.com/in/luckyim/?originalSubdomain=ca" target="_blank">LinkedIn</a>
    </div>
    <span class="footer-copy">© 2025 · Vancouver, CA</span>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
