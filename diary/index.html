<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Im — Diary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />

  <style>
    /* --- beach background canvas sits behind everything --- */
    #beach-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    /* --- make body + diary transparent so the canvas shows through --- */
    body { background: transparent; }
    #diary-page { background: transparent; }

    /* --- keep nav readable --- */
    nav {
      background: rgba(8, 18, 48, 0.55);
      backdrop-filter: blur(6px);
      border-color: rgba(255,255,255,0.08);
    }
    .nav-logo,
    .nav-links a { color: rgba(255,255,255,0.85); }
    .nav-links a:hover,
    .nav-links a.active { color: #ffffff; }
    .nav-hamburger span { background: rgba(255,255,255,0.85); }
    .nav-mobile-menu {
      background: rgba(8, 18, 48, 0.97);
      border-color: rgba(255,255,255,0.08);
      top: 65px;
    }
    .nav-mobile-menu a { color: rgba(160,210,240,0.75); border-color: rgba(255,255,255,0.08); }
    .nav-mobile-menu a:hover,
    .nav-mobile-menu a.active { color: #ffffff; }

    /* --- diary section label --- */
    .section-label { color: rgba(255,255,255,0.5); }
    .section-label::after { background: rgba(255,255,255,0.15); }

    /* --- diary entry cards: semi-transparent dark glass --- */
    .diary-entry {
      background: rgba(6, 14, 40, 0.55);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 10px;
      padding: 32px 36px;
      border-bottom: 1px solid rgba(255,255,255,0.10);
    }
    .diary-date   { color: rgba(160, 210, 240, 0.75); }
    .diary-title  { color: #e8f4ff; }
    .diary-text   { color: rgba(200, 225, 245, 0.80); }
    .diary-more   { color: rgba(160, 200, 230, 0.6); }

    /* --- footer --- */
    footer {
      background: rgba(6, 12, 35, 0.70);
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .footer-name  { color: #e8f4ff; }
    .footer-sub,
    .footer-copy  { color: rgba(160, 200, 230, 0.6); }
    .footer-links a { color: rgba(160, 210, 240, 0.75); }
    .footer-links a:hover { color: #ffffff; }
  </style>
</head>
<body>

  <!-- pixel-art beach background -->
  <div id="beach-bg"></div>

  <!-- NAV -->
  <nav id="nav">
    <a class="nav-logo" href="/">LI</a>
    <ul class="nav-links">
      <li><a href="/about">About</a></li>
      <li><a href="/projects">Projects</a></li>
      <li><a href="/diary">Diary</a></li>
    </ul>
    <button class="nav-hamburger" id="nav-hamburger" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- DIARY -->
  <!-- To add an entry: copy a diary-entry block and paste above (newest first) -->
  <section id="diary-page">
    <div class="section-label reveal">Diary</div>

    <div class="diary-entry reveal">
      <div class="diary-date">March 9, 2025</div>
      <h3 class="diary-title">Resting</h3>
      <p class="diary-text">
        warm bath, warm tea and sweet dream
      </p>
    </div>

    <p class="diary-more reveal">More entries coming soon —</p>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="footer-left">
      <span class="footer-name">Lucky Im</span>
      <span class="footer-sub">Creative engineer seeking the key to the world's bottleneck.</span>
    </div>
    <div class="footer-links">
      <a href="https://github.com/luckyim0519" target="_blank">GitHub</a>
      <a href="https://www.linkedin.com/in/luckyim/?originalSubdomain=ca" target="_blank">LinkedIn</a>
    </div>
    <span class="footer-copy">© 2025 · Vancouver, CA</span>
  </footer>

  <script src="../js/main.js"></script>
  <script src="../js/p5.min.js"></script>
  <script>
    new p5(function (p) {
      const PX = 5;
      let cols, rows, t = 0;

      // ── Detect time-of-day scene ──────────────────────────────────────
      // morning: 6–12  |  afternoon/sunset: 12–19  |  night: 19–6
      const hour = new Date().getHours();
      const SCENE = hour >= 6 && hour < 12 ? 'morning'
                  : hour >= 12 && hour < 19 ? 'afternoon'
                  : 'night';

      // ── Scene palettes ────────────────────────────────────────────────
      const SCENES = {
        morning: {
          skyTop:   [  95, 165, 220 ],  // bright blue
          skyMid:   [ 140, 200, 235 ],
          skyHor:   [ 200, 230, 248 ],  // pale horizon
          skyGlow:  [ 230, 245, 255 ],
          orb:      [ 255, 245, 180 ],  // warm yellow sun
          orbGlow:  [ 255, 210,  80 ],
          orbR:     4,
          orbCX:    0.38,               // upper-left-ish
          orbCY:    0.20,
          stars:    false,
          sea: [
            [  18,  80, 140 ],
            [  28, 110, 175 ],
            [  40, 145, 205 ],
            [  60, 175, 225 ],
            [  90, 205, 240 ],
            [ 140, 225, 250 ],
          ],
          foam:     [ 220, 245, 255 ],
          glint:    [ 255, 255, 255 ],
          sand: [
            [ 240, 215, 150 ],
            [ 225, 195, 125 ],
            [ 205, 172, 100 ],
            [ 180, 148,  78 ],
          ],
          sandWet:  [ 175, 185, 170 ],
        },
        afternoon: {
          skyTop:   [  30,  30,  80 ],  // deep blue-purple at top
          skyMid:   [  90,  60,  80 ],  // purple-pink mid
          skyHor:   [ 200,  95,  55 ],  // burnt orange horizon
          skyGlow:  [ 240, 140,  50 ],  // golden sunset band
          orb:      [ 255, 180,  60 ],  // orange-gold setting sun
          orbGlow:  [ 255, 120,  30 ],
          orbR:     5,
          orbCX:    0.72,               // lower right — setting
          orbCY:    0.38,
          stars:    false,
          sea: [
            [  20,  35,  80 ],
            [  35,  65, 115 ],
            [  55, 100, 155 ],
            [  85, 140, 185 ],
            [ 130, 175, 210 ],
            [ 180, 210, 230 ],
          ],
          foam:     [ 255, 220, 180 ],  // warm foam tinted by sunset
          glint:    [ 255, 240, 160 ],  // golden glints
          sand: [
            [ 220, 175,  95 ],
            [ 200, 150,  70 ],
            [ 175, 125,  50 ],
            [ 148, 100,  38 ],
          ],
          sandWet:  [ 145, 130, 100 ],
        },
        night: {
          skyTop:   [   4,   5,  18 ],  // near-black
          skyMid:   [   8,  12,  38 ],
          skyHor:   [  14,  22,  58 ],
          skyGlow:  [  20,  32,  72 ],
          orb:      [ 240, 245, 255 ],  // white-blue full moon
          orbGlow:  [ 180, 200, 240 ],
          orbR:     4,
          orbCX:    0.72,
          orbCY:    0.28,
          stars:    true,
          sea: [
            [  5,  10,  35 ],
            [  8,  20,  60 ],
            [ 12,  35,  90 ],
            [ 18,  55, 120 ],
            [ 30,  85, 155 ],
            [ 60, 130, 195 ],
          ],
          foam:     [ 190, 215, 240 ],
          glint:    [ 230, 242, 255 ],
          sand: [
            [ 155, 148, 130 ],
            [ 135, 128, 112 ],
            [ 115, 108,  94 ],
            [  95,  90,  78 ],
          ],
          sandWet:  [ 80, 92, 100 ],
        },
      };

      const S = SCENES[SCENE];

      // ── Wave layers (same structure for all scenes) ───────────────────
      const WAVES = [
        { base: 0.50, amp: 1.0, freq: 0.10, spd: 0.022, crest: 1, ci: 0 },
        { base: 0.56, amp: 1.3, freq: 0.13, spd: 0.030, crest: 1, ci: 1 },
        { base: 0.62, amp: 1.8, freq: 0.11, spd: 0.040, crest: 2, ci: 2 },
        { base: 0.68, amp: 2.2, freq: 0.09, spd: 0.052, crest: 2, ci: 3 },
        { base: 0.74, amp: 2.6, freq: 0.08, spd: 0.065, crest: 3, ci: 4 },
        { base: 0.80, amp: 3.0, freq: 0.07, spd: 0.080, crest: 3, ci: 5 },
      ];

      let glints = [];
      function initGlints() {
        glints = [];
        const n = Math.floor(cols * 0.14);
        for (let i = 0; i < n; i++) {
          glints.push({
            c: Math.floor(Math.random() * cols),
            li: Math.floor(Math.random() * WAVES.length),
            phase: Math.random() * Math.PI * 2,
            rate: 0.035 + Math.random() * 0.05,
          });
        }
      }

      function drawPx(c, r, col) {
        p.fill(col[0], col[1], col[2]);
        p.rect(c * PX, r * PX, PX, PX);
      }

      function skyColor(r, skyRows) {
        const horRows = Math.floor(skyRows * 0.86);
        if (r >= horRows) {
          const pct = (r - horRows) / (skyRows - horRows);
          return [
            Math.round(p.lerp(S.skyMid[0], S.skyGlow[0], pct)),
            Math.round(p.lerp(S.skyMid[1], S.skyGlow[1], pct)),
            Math.round(p.lerp(S.skyMid[2], S.skyGlow[2], pct)),
          ];
        }
        const pct = r / horRows;
        return [
          Math.round(p.lerp(S.skyTop[0], S.skyMid[0], pct)),
          Math.round(p.lerp(S.skyTop[1], S.skyMid[1], pct)),
          Math.round(p.lerp(S.skyTop[2], S.skyMid[2], pct)),
        ];
      }

      p.setup = function () {
        const el = document.getElementById('beach-bg');
        p.createCanvas(el.offsetWidth, el.offsetHeight).parent('beach-bg');
        cols = Math.ceil(p.width  / PX);
        rows = Math.ceil(p.height / PX);
        p.noStroke();
        p.frameRate(18);
        initGlints();
      };

      p.draw = function () {
        p.clear();
        t += 1;

        const surfs = WAVES.map(w => {
          const arr = new Float32Array(cols);
          for (let c = 0; c < cols; c++) {
            const raw = Math.sin(c * w.freq - t * w.spd)
                      + 0.4 * Math.sin(c * w.freq * 2.5 - t * w.spd * 1.6)
                      + 0.2 * Math.sin(c * w.freq * 4.1 - t * w.spd * 0.7);
            const biased = (raw + 1.6) / 3.2;
            arr[c] = (w.base + (biased - 0.5) * (w.amp / rows)) * rows;
          }
          return arr;
        });

        const glintPx = new Set();
        for (const g of glints) {
          const v = (Math.sin(t * g.rate + g.phase) + 1) / 2;
          if (v > 0.72) glintPx.add(`${g.c},${Math.round(surfs[g.li][g.c])}`);
        }

        const skyRows = Math.floor(rows * 0.48);
        const sandRow = Math.floor(rows * 0.84);
        const wetRow  = Math.floor(rows * 0.82);
        const orbCX   = Math.floor(cols * S.orbCX);
        const orbCY   = Math.floor(rows * S.orbCY);

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {

            // ── sky ──
            if (r < skyRows) {
              const dc = c - orbCX, dr = r - orbCY;
              const dist = Math.sqrt(dc * dc + dr * dr);

              if (dist <= S.orbR) {
                drawPx(c, r, S.orb);
              } else if (dist <= S.orbR + 2) {
                drawPx(c, r, S.orbGlow);
              } else if (dist <= S.orbR + 6) {
                const sk = skyColor(r, skyRows);
                const blend = 1 - (dist - S.orbR - 2) / 4;
                drawPx(c, r, [
                  Math.round(p.lerp(sk[0], S.orbGlow[0], blend * 0.5)),
                  Math.round(p.lerp(sk[1], S.orbGlow[1], blend * 0.5)),
                  Math.round(p.lerp(sk[2], S.orbGlow[2], blend * 0.5)),
                ]);
              } else if (S.stars) {
                const seed = (c * 7919 + r * 6271) % 1000;
                if (r < Math.floor(rows * 0.44) && seed < 12) {
                  const twinkle = (Math.sin(t * 0.06 + seed) + 1) / 2;
                  const bright  = Math.round(180 + twinkle * 75);
                  drawPx(c, r, [bright, bright, Math.min(bright + 20, 255)]);
                } else {
                  drawPx(c, r, skyColor(r, skyRows));
                }
              } else {
                drawPx(c, r, skyColor(r, skyRows));
              }
              continue;
            }

            // ── sand ──
            if (r >= sandRow) {
              const pct = (r - sandRow) / (rows - sandRow);
              const si  = Math.min(Math.floor(pct * S.sand.length), S.sand.length - 1);
              drawPx(c, r, S.sand[si]);
              continue;
            }

            // ── wet sand ──
            if (r >= wetRow) {
              drawPx(c, r, S.sandWet);
              continue;
            }

            // ── waves ──
            let drawn = false;
            for (let li = WAVES.length - 1; li >= 0; li--) {
              const w   = WAVES[li];
              const srf = surfs[li][c];
              if (r >= srf) {
                const depth = r - srf;
                if (depth === 0 && glintPx.has(`${c},${Math.round(srf)}`)) {
                  drawPx(c, r, S.glint);
                  drawn = true; break;
                }
                if (depth < w.crest) {
                  const ft   = 1 - depth / w.crest;
                  const base = S.sea[Math.min(w.ci + 1, S.sea.length - 1)];
                  drawPx(c, r, [
                    Math.round(p.lerp(base[0], S.foam[0], ft * 0.88)),
                    Math.round(p.lerp(base[1], S.foam[1], ft * 0.88)),
                    Math.round(p.lerp(base[2], S.foam[2], ft * 0.88)),
                  ]);
                } else {
                  const shimmer = ((c + r + Math.floor(t * 0.5)) % 6 === 0) ? 14 : 0;
                  const base    = S.sea[w.ci];
                  drawPx(c, r, [
                    Math.min(base[0] + shimmer, 255),
                    Math.min(base[1] + shimmer, 255),
                    Math.min(base[2] + shimmer, 255),
                  ]);
                }
                drawn = true; break;
              }
            }
            if (!drawn) drawPx(c, r, S.sea[0]);
          }
        }
      };

      p.windowResized = function () {
        const el = document.getElementById('beach-bg');
        p.resizeCanvas(el.offsetWidth, el.offsetHeight);
        cols = Math.ceil(p.width  / PX);
        rows = Math.ceil(p.height / PX);
        initGlints();
      };
    });
  </script>
</body>
</html>
