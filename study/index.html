<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Im — Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&family=Source+Code+Pro:wght@400;500&family=Libre+Barcode+128+Text&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />

  <style>
    body { background: var(--off); }

    /* ── outer: two independent tree blocks side by side ── */
    .study-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      margin-top: 8px;
    }

    /* ── each tree block: [label col | content col] ── */
    .tree-block {
      display: grid;
      grid-template-columns: 28px 1fr;
      align-items: center;
    }

    /* ── left label cells ── */
    .row-label {
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: stretch;
    }
    .depth-label {
      font-family: 'Source Code Pro', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      writing-mode: vertical-rl;
      transform: rotate(180deg); /* reads upward */
    }

    /* ── root ── */
    .tree-root-cell { display: flex; justify-content: center; }
    .tree-root {
      font-family: 'Libre Barcode 128 Text', cursive;
      font-size: 2.2rem;
      color: var(--ink);
      display: block;
      text-align: center;
    }

    /* ── branch SVG ── */
    .branch-cell { display: flex; justify-content: center; }
    .branch-svg {
      width: 180px;
      height: 64px;
      display: block;
      color: var(--ink);
      flex-shrink: 0;
    }

    /* ── field row (depth 1) ── */
    .field-cell {
      display: flex;
      justify-content: space-between;
      width: 180px;
      justify-self: center;
      padding: 4px 0;
    }

    /* ── sub-branch SVG ── */
    .sub-cell {
      display: flex;
      justify-content: space-between;
      width: 180px;
      justify-self: center;
      align-items: flex-start;
    }
    .sub-svg {
      width: 64px;
      height: 48px;
      display: block;
      color: var(--ink);
      flex-shrink: 0;
    }
    .cell-spacer { width: 64px; flex-shrink: 0; }

    /* ── topic row (depth 2) ── */
    .topic-cell {
      display: flex;
      justify-content: space-between;
      width: 180px;
      justify-self: center;
      padding: 4px 0;
    }

    /* ── leaf node ── */
    .tree-leaf {
      text-decoration: none;
      display: block;
      width: 64px;
      text-align: center;
    }
    .leaf-name {
      font-family: 'Source Code Pro', monospace;
      font-size: 0.8rem;
      color: var(--ink);
      display: block;
    }
    .tree-leaf:hover .leaf-name {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ── responsive ── */
    @media (max-width: 768px) {
      .study-layout { grid-template-columns: 1fr; gap: 64px; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav id="nav">
    <a class="nav-logo" href="/">LI</a>
    <ul class="nav-links">
      <li><a href="/about">About</a></li>
      <li><a href="/study" class="active">Study</a></li>
      <li><a href="/art">Art</a></li>
    </ul>
    <button class="nav-hamburger" id="nav-hamburger" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <section id="study-page">
    <div class="section-label reveal">Study</div>

    <div class="study-layout">

      <!-- ══ #AI tree block ══ -->
      <div class="tree-block reveal">
        <!-- root -->
        <div class="row-empty"></div>
        <div class="tree-root-cell"><span class="tree-root">#AI</span></div>

        <!-- branch lines -->
        <div class="row-empty"></div>
        <div class="branch-cell">
          <svg class="branch-svg" viewBox="0 0 180 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <line x1="90" y1="0" x2="32"  y2="64" stroke="currentColor" stroke-width="1"/>
            <line x1="90" y1="0" x2="148" y2="64" stroke="currentColor" stroke-width="1"/>
          </svg>
        </div>

        <!-- FIELD row -->
        <div class="row-label"><span class="depth-label">Field</span></div>
        <div class="field-cell">
          <a class="tree-leaf" href="/study/entry1"><span class="leaf-name">Entry 1</span></a>
          <a class="tree-leaf" href="/study/entry2"><span class="leaf-name">Entry 2</span></a>
        </div>

        <!-- sub-branch: under Entry 1 (left) -->
        <div class="row-empty"></div>
        <div class="sub-cell">
          <svg class="sub-svg" viewBox="0 0 64 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <line x1="32" y1="0" x2="32" y2="48" stroke="currentColor" stroke-width="1"/>
          </svg>
          <div class="cell-spacer"></div>
        </div>

        <!-- TOPIC row -->
        <div class="row-label"><span class="depth-label">Topic</span></div>
        <div class="topic-cell">
          <a class="tree-leaf" href="/study/entry3"><span class="leaf-name">Entry 3</span></a>
          <div class="cell-spacer"></div>
        </div>
      </div>

      <!-- ══ #SW tree block ══ -->
      <div class="tree-block reveal">
        <!-- root -->
        <div class="row-empty"></div>
        <div class="tree-root-cell"><span class="tree-root">#SW</span></div>

        <!-- branch lines -->
        <div class="row-empty"></div>
        <div class="branch-cell">
          <svg class="branch-svg" viewBox="0 0 180 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <line x1="90" y1="0" x2="32"  y2="64" stroke="currentColor" stroke-width="1"/>
            <line x1="90" y1="0" x2="148" y2="64" stroke="currentColor" stroke-width="1"/>
          </svg>
        </div>

        <!-- FIELD row -->
        <div class="row-label"><span class="depth-label">Field</span></div>
        <div class="field-cell">
          <a class="tree-leaf" href="/study/sw/entry1"><span class="leaf-name">Entry 1</span></a>
          <a class="tree-leaf" href="/study/sw/entry2"><span class="leaf-name">Entry 2</span></a>
        </div>

        <!-- sub-branch: under Entry 2 (right) -->
        <div class="row-empty"></div>
        <div class="sub-cell">
          <div class="cell-spacer"></div>
          <svg class="sub-svg" viewBox="0 0 64 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <line x1="32" y1="0" x2="32" y2="48" stroke="currentColor" stroke-width="1"/>
          </svg>
        </div>

        <!-- TOPIC row -->
        <div class="row-label"><span class="depth-label">Topic</span></div>
        <div class="topic-cell">
          <div class="cell-spacer"></div>
          <a class="tree-leaf" href="/study/sw/entry3"><span class="leaf-name">Entry 3</span></a>
        </div>
      </div>

    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="footer-left">
      <span class="footer-name">Lucky Im</span>
      <span class="footer-sub">Creative engineer seeking the key to the world's bottleneck.</span>
    </div>
    <div class="footer-links">
      <a href="https://github.com/luckyim0519" target="_blank">GitHub</a>
      <a href="https://www.linkedin.com/in/luckyim/?originalSubdomain=ca" target="_blank">LinkedIn</a>
    </div>
    <span class="footer-copy">© 2025 · Vancouver, CA</span>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
