<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Im — Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />

  <style>
    body { background: var(--off); }

    /* ── tree layout ── */
    .study-tree {
      display: flex;
      gap: 100px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .tree-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      position: relative;
    }

    /* ── root: plain text, no decoration ── */
    .tree-root {
      font-family: 'DM Serif Display', serif;
      font-size: 1.5rem;
      color: var(--ink);
      letter-spacing: 0.04em;
      display: block;
    }

    /* ── diagonal connector ── */
    /* Box is 40px wide × 44px tall; line length = sqrt(40²+44²) ≈ 59px at 48° */
    .diag-connector {
      position: relative;
      width: 40px;
      height: 44px;
      margin-left: 6px;
      flex-shrink: 0;
    }
    .diag-connector::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 59px;
      height: 1px;
      background: var(--ink);
      transform: rotate(48deg);
      transform-origin: left center;
    }

    /* ── leaf (entry) ── */
    .tree-leaf {
      text-decoration: none;
      display: block;
      margin-left: 40px;
    }
    .leaf-title {
      font-family: 'DM Serif Display', serif;
      font-size: 0.95rem;
      color: var(--ink);
      display: block;
    }
    .leaf-date {
      font-size: 0.72rem;
      color: var(--muted);
      display: block;
      margin-top: 2px;
    }
    .tree-leaf:hover .leaf-title {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ── responsive ── */
    @media (max-width: 768px) {
      .study-tree { flex-direction: column; gap: 56px; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav id="nav">
    <a class="nav-logo" href="/">LI</a>
    <ul class="nav-links">
      <li><a href="/about">About</a></li>
      <li><a href="/study" class="active">Study</a></li>
      <li><a href="/art">Art</a></li>
    </ul>
    <button class="nav-hamburger" id="nav-hamburger" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- STUDY TREE -->
  <section id="study-page">
    <div class="section-label reveal">Study</div>

    <div class="study-tree">

      <!-- AI subtree -->
      <div class="tree-col reveal">
        <span class="tree-root">AI</span>
        <div class="diag-connector"></div>
        <a class="tree-leaf" href="/study/entry1">
          <span class="leaf-title">Entry 1</span>
          <span class="leaf-date">March 2026</span>
        </a>
      </div>

      <!-- SW subtree -->
      <div class="tree-col reveal">
        <span class="tree-root">SW</span>
      </div>

    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="footer-left">
      <span class="footer-name">Lucky Im</span>
      <span class="footer-sub">Creative engineer seeking the key to the world's bottleneck.</span>
    </div>
    <div class="footer-links">
      <a href="https://github.com/luckyim0519" target="_blank">GitHub</a>
      <a href="https://www.linkedin.com/in/luckyim/?originalSubdomain=ca" target="_blank">LinkedIn</a>
    </div>
    <span class="footer-copy">© 2025 · Vancouver, CA</span>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
